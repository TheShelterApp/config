# TheShelterApp/config — validate on PR, publish per branch → env on push.
# The signer is the bundled tools/config-tool.mjs (self-contained; no registry needed).
# Secret: CONFIG_ED25519_PRIVATE (PKCS#8 PEM). The `prod` environment requires 1 reviewer.
name: config
on:
  pull_request:
    paths: ['docs/**']
  push:
    branches: [dev, staging, main]
    paths: ['docs/**', 'tools/**', '.github/workflows/**']

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node tools/config-tool.mjs validate docs/

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Validate
        run: node tools/config-tool.mjs validate docs/
      - name: Seal (JCS + Ed25519, monotonic guard)
        env:
          CONFIG_ED25519_PRIVATE: ${{ secrets.CONFIG_ED25519_PRIVATE }}
          ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
        run: |
          VERSION=$(git rev-list --count HEAD)
          node tools/config-tool.mjs seal docs/ --env "$ENV" --version "$VERSION" --git-sha "$GITHUB_SHA" --kid cfg-2026a --out "published/$ENV/v1/"
          echo "sealed $ENV v$VERSION"
      # publish (R2 then KV) is added once the config Worker's R2/KV credentials are provisioned:
      #   node tools/config-tool.mjs publish published/$ENV/v1/ --r2 --then-kv
      - name: Commit the published mirror (raw.githubusercontent fallback)
        run: |
          git config user.name config-bot
          git config user.email bot@users.noreply.github.com
          git add published/
          git commit -m "publish ${{ github.ref_name == 'main' && 'prod' || github.ref_name }} v$(git rev-list --count HEAD)" && git push || echo "no change to publish"
