# TheShelterApp/config — validate on PR, publish per branch → env on push.
# The signer is the bundled tools/config-tool.mjs (self-contained; no registry needed).
# Secret: CONFIG_ED25519_PRIVATE (PKCS#8 PEM). The `prod` environment requires 1 reviewer.
name: config
on:
  pull_request:
    paths: ['docs/**']
  push:
    branches: [dev, staging, main]
    paths: ['docs/**', 'tools/**', '.github/workflows/**']
  schedule:
    # Freshness heartbeat (the `refresh` job below). GitHub runs `schedule` ONLY from the workflow file on the
    # DEFAULT branch (dev) — so this file is kept identical on dev/staging/main and the job checks out each
    # env's branch itself. Twice a week keeps every signed doc far inside its max-age (bundle 30 d, policy
    # 90 d) even if a run or two is missed, and the mirror commit keeps the repo "active" (GitHub disables
    # schedules on a public repo after 60 days without activity).
    - cron: '23 5 * * 1,4'
  # Manual run of the same refresh (e.g. to prove it after a workflow change, or ahead of an expiry).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: node tools/config-tool.mjs validate docs/

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Validate
        run: node tools/config-tool.mjs validate docs/
      - name: Seal (JCS + Ed25519, monotonic guard)
        env:
          CONFIG_ED25519_PRIVATE: ${{ secrets.CONFIG_ED25519_PRIVATE }}
          ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
        run: |
          VERSION=$(git rev-list --count HEAD)
          node tools/config-tool.mjs seal docs/ --env "$ENV" --version "$VERSION" --git-sha "$GITHUB_SHA" --kid cfg-2026a --out "published/$ENV/v1/"
          echo "sealed $ENV v$VERSION"
      - name: Seal alerts-policy (standalone signed doc the alerts-gateway reads from the data bucket)
        env:
          CONFIG_ED25519_PRIVATE: ${{ secrets.CONFIG_ED25519_PRIVATE }}
          ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
        run: |
          VERSION=$(git rev-list --count HEAD)
          # --max-age 90d: a stable policy must not silently expire to the fallback between infrequent edits
          # (there is no cron re-seal yet). An expiry is now observable — the gateway surfaces the effective
          # policy in status.json (source:signed|fallback + reason). Replace with a scheduled re-seal + a
          # moderate max-age once the R2 upload (below) is wired with CI credentials.
          node tools/config-tool.mjs seal-policy docs/alerts-policy.json --env "$ENV" --version "$VERSION" --kid cfg-2026a --max-age 7776000 --out "published/$ENV/v1/"
          echo "sealed alerts-policy $ENV v$VERSION"
      - name: Publish alerts-policy → data bucket (R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
        run: |
          # The gateway reads alerts/policy.json from shelter-data-<env>; this makes a push ACTIVATE it.
          npx --yes wrangler@4 r2 object put "shelter-data-$ENV/alerts/policy.json" \
            --file "published/$ENV/v1/alerts/policy.json" --remote --content-type application/json
          echo "uploaded alerts-policy → shelter-data-$ENV/alerts/policy.json"
      # The config BUNDLE publish (config bucket + KV, for config.theshelter.app) is separate (PF-07/08):
      #   node tools/config-tool.mjs publish published/$ENV/v1/ --r2 --then-kv
      # ROLLBACK: signed-policy replay is closed by a consumer-side version floor in the gateway (detector DO),
      # not here — see the alerts-gateway. This job only publishes owner-approved (or scheduled-refresh) content.
      - name: Commit the published mirror (what config.theshelter.app serves)
        run: |
          set -euo pipefail
          git config user.name config-bot
          git config user.email bot@users.noreply.github.com
          git add published/
          git diff --cached --quiet && { echo "no change to publish"; exit 0; }
          git commit -m "publish ${{ github.ref_name == 'main' && 'prod' || github.ref_name }} v$(git rev-list --count HEAD)"
          # A failed push must FAIL the job (it used to be swallowed as "no change"): an unpushed mirror means
          # the new config never goes live. Rebase first in case a scheduled refresh landed meanwhile.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

  # Unattended freshness: re-seal the LAST PUBLISHED content of every env with a fresh generatedAt, so a stable,
  # rarely-edited config never silently expires (an expired BUNDLE strands fresh installs on the compiled
  # default and blocks kill-switch delivery; an expired POLICY drops the gateway to the restrictive fallback).
  # NO `environment:` gate, and it is safe without one: the content is NOT the branch HEAD but the docs at the
  # `gitSha` recorded inside the currently published bundle — i.e. exactly what was last approved and published.
  # A push that is still waiting on the prod reviewer can therefore never be released by the schedule.
  # The version (commit count) only grows, so the consumers' version floors accept it.
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env: dev, ref: dev }
          - { env: staging, ref: staging }
          - { env: prod, ref: main }
    # Serializes refreshes of one branch. `publish` deliberately shares NO group with this: a publish parked on
    # the prod reviewer gate would otherwise block the heartbeat indefinitely. The rare publish/refresh race is
    # handled by `git pull --rebase` (a genuine conflict fails the job loudly; re-run it).
    concurrency: { group: "config-refresh-${{ matrix.ref }}", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ matrix.ref }}", fetch-depth: 0, persist-credentials: true }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Re-seal the last published content (freshness only)
        env:
          CONFIG_ED25519_PRIVATE: ${{ secrets.CONFIG_ED25519_PRIVATE }}
          ENV: ${{ matrix.env }}
        run: |
          set -euo pipefail
          PUBLISHED_SHA=$(node -e "const e=require('./published/$ENV/v1/bundle.json');const s=JSON.parse(Buffer.from(e.payload,'base64').toString('utf8')).gitSha;if(!/^[0-9a-f]{40}$/.test(s)||/^0+$/.test(s))throw new Error('published bundle carries no usable gitSha');console.log(s)")
          git cat-file -e "$PUBLISHED_SHA^{commit}"
          git checkout "$PUBLISHED_SHA" -- docs/
          VERSION=$(git rev-list --count HEAD)
          node tools/config-tool.mjs validate docs/
          node tools/config-tool.mjs seal docs/ --env "$ENV" --version "$VERSION" --git-sha "$PUBLISHED_SHA" --kid cfg-2026a --out "published/$ENV/v1/"
          node tools/config-tool.mjs seal-policy docs/alerts-policy.json --env "$ENV" --version "$VERSION" --kid cfg-2026a --max-age 7776000 --out "published/$ENV/v1/"
          # Put docs/ back to the branch HEAD so only published/ is committed below.
          git checkout HEAD -- docs/
          echo "re-sealed $ENV v$VERSION from $PUBLISHED_SHA"
      - name: Publish alerts-policy → data bucket (R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENV: ${{ matrix.env }}
        run: |
          npx --yes wrangler@4 r2 object put "shelter-data-$ENV/alerts/policy.json" \
            --file "published/$ENV/v1/alerts/policy.json" --remote --content-type application/json
      - name: Commit the refreshed mirror (what config.theshelter.app serves)
        run: |
          set -euo pipefail
          git config user.name config-bot
          git config user.email bot@users.noreply.github.com
          git add published/
          git diff --cached --quiet && { echo "nothing to refresh"; exit 0; }
          git commit -m "refresh ${{ matrix.env }} v$(git rev-list --count HEAD)"
          # A push made with GITHUB_TOKEN does not start another workflow run, so this cannot loop or
          # trip the prod reviewer gate.
          git pull --rebase origin "${{ matrix.ref }}"
          git push origin "HEAD:${{ matrix.ref }}"
